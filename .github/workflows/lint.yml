name: Lint

on:
  push:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install flake8
        run: python -m pip install --upgrade flake8

      - name: Byte-compile
        run: python -m py_compile usr/bin/ice usr/bin/ice-firefox

      - name: Lint with flake8
        run: flake8 usr/bin/ice usr/bin/ice-firefox
